repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.5
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff-check
        args: [ --fix ]
        files: ^(homeassistant|script|tests|custom_components)/.+\.py$
      - id: ruff-format
        files: ^(homeassistant|script|tests|custom_components)/.+\.py$
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=hass,alot,datas,dof,dur,faktor,farenheit,hist,iff,ines,ist,lightsensor,mut,nd,pres,referer,ser,serie,te,technik,ue,uint,visability,wan,wanna,withing,manuell,oder,aktive,stopp,sie,comando,comandos,tramas,trama,appareil,moteur,statuts,mouvement,connexion,inicial,fases,complet,posible
          - --skip="./.*,*.csv,*.json"
          - --quiet-level=2
        exclude: ^.*\.patch$
        exclude_types: [ csv, json ]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
        stages: [ manual ]
      - id: check-json
  # These hooks require the locally installed venv
  - repo: local
    hooks:
      # mypy 2.x's parallel type-checking (worker processes split the work
      # across CPU cores) shares state through the on-disk sqlite cache
      # (.mypy_cache), and concurrent workers writing to it can hit
      # "sqlite3.OperationalError: database is locked" - a known limitation
      # from when parallel checking was introduced, see
      # https://github.com/python/mypy/pull/20280. --cache-dir=/dev/null
      # disables the on-disk cache entirely, sidestepping the lock (CI runs
      # in a fresh VM every time anyway, so there is no cross-run cache
      # benefit to lose here). Local `uv run mypy` calls outside this hook
      # are unaffected and keep the normal on-disk cache.
      - id: mypy
        name: mypy
        entry: uv run mypy
        args:
          - --pretty
          - --show-error-codes
          - --show-error-context
          - --cache-dir=/dev/null
        language: system
        pass_filenames: true
        files: ^(tests|custom_components)/.+\.py$
      - id: pytest
        name: pytest
        entry: uv run pytest
        args:
          - --no-cov
        language: system
        pass_filenames: false
        files: ^(tests|custom_components)/.+\.(py|json|yaml)$
