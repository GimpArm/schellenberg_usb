[project]
name = "schellenberg_usb"
version = "v1.1.2"
readme = "README.md"
# Floor for the dev/CI toolchain below (uv, mypy, pytest-homeassistant-
# custom-component) - unrelated to the *integration's* own minimum
# supported Home Assistant version, which stays governed by hacs.json's
# "homeassistant" key (2025.3.0) so users on older Core installs are not
# dropped by this bump.
requires-python = ">=3.14.2"
dependencies = [
    # A minimum instead of an exact pin: Home Assistant Core's own serialx
    # requirement moves forward on its own schedule (it went from 1.10.0 to
    # 1.11.0 between two consecutive hassfest runs here), and hassfest
    # rejects an exact pin that no longer matches Core's. >= stays
    # compatible with whatever Core currently needs, same fix other HACS
    # integrations have used for this exact class of hassfest failure.
    "serialx>=1.10.0",
]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" }
]

test = [
    "croniter~=6.0.0",
    "watchdog~=6.0.0",
    "mock-open~=1.4.0",
    "polyfactory~=3.1.0",
    "PyYAML~=6.0.2",
    # Need specific versions
    "pytest-homeassistant-custom-component==0.13.371",
    # Versions handled by pytest-homeassistant-custom-component
    "freezegun",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

lint = [
    "mypy~=2.4.0",
    "pre-commit~=4.5.0",
    "ruff~=0.17.0",
    "types-PyYAML~=6.0.12.20250915",
]


[tool.coverage.run]
source = ["custom_components"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplemented()",
    "if __name__ == '__main__':",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git"]
# Without this, bare `pytest`/`uv run pytest` cannot import `custom_components`:
# `tests/` has no `__init__.py` (by design - it isn't itself a package), so
# pytest's default import mode only ever adds `tests/` to sys.path, never the
# repository root. `python -m pytest` masks this (the -m flag adds the cwd to
# sys.path itself), which is likely why this went unnoticed - but the "Run
# pytest" step in build-test.yaml and the local pre-commit hook both invoke
# the bare `pytest` entry point via `uv run pytest`, not `-m pytest`.
pythonpath = ["."]
addopts = """
-n4
--strict-markers
--cov=custom_components
--timeout=60
--timeout-method=thread"""
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Inheritance class CountingClientSession from ClientSession is discouraged:DeprecationWarning",
]

[tool.mypy]
python_version = "3.14"
pretty = true
follow_imports = "silent"
ignore_missing_imports = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
strict = true

# Home Assistant Core replaced voluptuous with its own "probatio" validation
# engine (2026.10) and aliases the `voluptuous` import to it in sys.modules
# at runtime, so integration code needs no changes and keeps working
# unmodified (`import voluptuous as vol` still works; see
# https://developers.home-assistant.io/blog/2026/09/30/probatio-validation-engine).
# mypy does not see that runtime alias, though: it still resolves `vol.Schema`
# to the real voluptuous.schema_builder.Schema, which Home Assistant's own
# typed APIs (FlowHandler.async_show_form, ServiceRegistry.async_register)
# now declare as probatio.schema.Schema - an unrelated type as far as mypy is
# concerned, hence "incompatible type" on every vol.Schema(...) we pass in.
# Skipping type-checking of the voluptuous module itself (treating it as Any)
# sidesteps that false mismatch without touching any integration code; this
# only loosens checking *inside* voluptuous calls (e.g. a misspelled
# attribute accessed on vol would no longer be caught), not anywhere else.
[[tool.mypy.overrides]]
module = "voluptuous.*"
follow_imports = "skip"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "UP",    # pyupgrade - modern Python syntax
    "B",     # flake8-bugbear - likely bugs
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "I",     # isort - import sorting
    "ASYNC", # flake8-async - blocking calls in async code
    "RUF",   # ruff-specific rules
]

# No line-length override here: this previously pinned pycodestyle to 80
# columns, but E501 was never in `select` so it was silently unenforced,
# while `ruff format` (already a pre-commit hook) has always wrapped at the
# default 88. Selecting "E" above without fixing this would put the linter
# and the formatter in permanent conflict. 88 is ruff's own default for
# both, so leaving line-length unset here keeps them in sync.
